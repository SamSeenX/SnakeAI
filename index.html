<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Retro Snake 198X</title>
  <meta name="description" content="Autonomous AI-powered retro snake game inspired by 1980s CRT arcade hardware">
  
  <meta property="og:title" content="Retro Snake 198X">
  <meta property="og:description" content="Autonomous AI-powered retro snake game inspired by 1980s CRT arcade hardware">
  <meta property="og:image" content="/og-image.png">
  <meta property="og:image:width" content="256">
  <meta property="og:image:height" content="256">
  <meta name="twitter:card" content="summary">

  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#030803">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/tokens.css">
  <link rel="stylesheet" href="/src/styles/reset.css">
  <link rel="stylesheet" href="/src/styles/crt.css">
  <link rel="stylesheet" href="/src/styles/components.css">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
  <div id="app">
    <div id="game-title-header" class="text-glow-green">RETRO SNAKE 198X</div>

    <div id="top-bar">
      <div>SCORE:<br><span id="hud-score" style="color:var(--color-accent-gold);">00000</span></div>
      <div>BEST:<br><span id="hud-best" style="color:var(--color-phosphor);">00000</span></div>
      <div>GRID:<br><span id="hud-grid" style="color:var(--color-accent-cyan);">16x16</span></div>
    </div>

    <div id="game-box">
      <canvas id="canvas" width="400" height="400"></canvas>
      <div class="crt-overlay"></div>
      <div id="overlay" class="overlay">
        <div id="overlay-title" class="title">NEON COBRA</div>
        <button id="start-btn" class="btn">PRESS START</button>
      </div>
    </div>

    <div id="controller">
      <div class="pad-status">CONTROLLER ACTIVE</div>
      <div class="dpad" role="group" aria-label="Virtual directional pad">
        <div></div>
        <button id="btn-up" class="dbtn" aria-label="Up">&#9650;</button>
        <div></div>
        <button id="btn-left" class="dbtn" aria-label="Left">&#9664;</button>
        <button id="btn-down" class="dbtn" aria-label="Down">&#9660;</button>
        <button id="btn-right" class="dbtn" aria-label="Right">&#9654;</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
